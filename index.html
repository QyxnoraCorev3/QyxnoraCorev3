<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QyxnoraCore v3 Ultra - Cyber Glass 3D</title>

<style>
:root {
    --bg-main: #0b0f19;
    --card-bg: rgba(20, 26, 43, 0.65);
    --card-border: rgba(255, 255, 255, 0.08);
    --shadow-3d: 10px 10px 25px rgba(0, 0, 0, 0.5), -5px -5px 20px rgba(255, 255, 255, 0.02);
    --shadow-pressed: inset 4px 4px 10px rgba(0, 0, 0, 0.6), inset -4px -4px 10px rgba(255, 255, 255, 0.03);
    --accent-cyan: #00f2fe;
    --accent-purple: #9d4edd;
    --accent-rose: #ff2a6d;
    --text-primary: #e2e8f0;
    --text-secondary: #94a3b8;
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
}

body {
    background: var(--bg-main);
    color: var(--text-primary);
    min-height: 100vh;
    overflow-x: hidden;
}

/* Background Ambient Glows */
.glow-orb-1 {
    position: fixed;
    top: -150px;
    left: -150px;
    width: 500px;
    height: 500px;
    background: radial-gradient(circle, rgba(0, 242, 254, 0.12) 0%, transparent 70%);
    pointer-events: none;
    z-index: 0;
}

.glow-orb-2 {
    position: fixed;
    bottom: -150px;
    right: -150px;
    width: 500px;
    height: 500px;
    background: radial-gradient(circle, rgba(157, 78, 221, 0.12) 0%, transparent 70%);
    pointer-events: none;
    z-index: 0;
}

/* Toast Notifications */
.toast-container {
    position: fixed;
    top: 25px;
    right: 25px;
    z-index: 100000;
    display: flex;
    flex-direction: column;
    gap: 10px;
}

.toast {
    background: rgba(20, 26, 43, 0.9);
    border: 1px solid var(--accent-cyan);
    color: #fff;
    padding: 12px 20px;
    border-radius: 12px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    backdrop-filter: blur(10px);
    font-size: 13px;
    font-weight: 600;
    animation: slideIn 0.3s ease-out forwards;
}

@keyframes slideIn {
    from { transform: translateX(100%); opacity: 0; }
    to { transform: translateX(0); opacity: 1; }
}

/* Login Overlay */
.login-screen {
    position: fixed;
    inset: 0;
    background: rgba(11, 15, 25, 0.95);
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 99999;
    backdrop-filter: blur(20px);
}

.glass-card-3d {
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 24px;
    box-shadow: var(--shadow-3d);
    backdrop-filter: blur(15px);
}

.login-box {
    padding: 40px;
    width: 380px;
    text-align: center;
}

.brand-title {
    font-size: 26px;
    font-weight: 900;
    letter-spacing: -0.5px;
    background: linear-gradient(135deg, var(--accent-cyan), var(--accent-purple));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-bottom: 5px;
}

.brand-sub {
    font-size: 12px;
    color: var(--text-secondary);
    margin-bottom: 30px;
}

.input-field {
    width: 100%;
    padding: 14px 18px;
    background: rgba(11, 15, 25, 0.6);
    border: 1px solid var(--card-border);
    border-radius: 14px;
    color: #fff;
    font-size: 14px;
    outline: none;
    box-shadow: var(--shadow-pressed);
    margin-bottom: 15px;
    transition: 0.3s;
}

.input-field:focus {
    border-color: var(--accent-cyan);
    box-shadow: 0 0 15px rgba(0, 242, 254, 0.2);
}

/* 3D Interactive Buttons */
.btn-3d {
    padding: 14px 22px;
    border: none;
    border-radius: 14px;
    font-weight: 700;
    font-size: 13px;
    cursor: pointer;
    color: #fff;
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    box-shadow: var(--shadow-3d);
    transition: all 0.2s ease;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
}

.btn-3d:active {
    box-shadow: var(--shadow-pressed);
    transform: translateY(2px);
}

.btn-cyan { background: linear-gradient(135deg, #00c6ff, #0072ff); }
.btn-purple { background: linear-gradient(135deg, #7928ca, #b83280); }
.btn-rose { background: linear-gradient(135deg, #ff2a6d, #9a0036); }
.btn-emerald { background: linear-gradient(135deg, #059669, #10b981); }

/* App Dashboard Layout */
.app-container {
    display: none;
    min-height: 100vh;
    position: relative;
    z-index: 1;
}

.sidebar {
    width: 340px;
    padding: 30px 20px;
    display: flex;
    flex-direction: column;
    gap: 25px;
    border-right: 1px solid var(--card-border);
}

.user-profile {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 15px 20px;
}

.main-view {
    flex: 1;
    padding: 30px;
    display: flex;
    flex-direction: column;
    gap: 25px;
    overflow-y: auto;
}

/* Dashboard Stats Grid */
.stats-container {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 20px;
}

.stat-card-3d {
    padding: 20px;
    display: flex;
    align-items: center;
    gap: 15px;
}

.stat-icon {
    width: 50px;
    height: 50px;
    border-radius: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
    box-shadow: var(--shadow-pressed);
}

.stat-val { font-size: 26px; font-weight: 800; }
.stat-lbl { font-size: 11px; color: var(--text-secondary); font-weight: 600; }

/* Workspace Controls */
.controls-bar {
    display: flex;
    gap: 15px;
    align-items: center;
}

.search-box {
    flex: 1;
}

.filter-pills {
    display: flex;
    background: rgba(11, 15, 25, 0.6);
    padding: 5px;
    border-radius: 14px;
    box-shadow: var(--shadow-pressed);
}

.pill-btn {
    padding: 8px 18px;
    border: none;
    background: transparent;
    color: var(--text-secondary);
    font-weight: 600;
    font-size: 12px;
    border-radius: 10px;
    cursor: pointer;
}

.pill-btn.active {
    background: var(--card-bg);
    color: var(--accent-cyan);
    box-shadow: var(--shadow-3d);
}

/* Data List Rows */
.data-list {
    display: flex;
    flex-direction: column;
    gap: 12px;
    max-height: 380px;
    overflow-y: auto;
}

.data-row {
    padding: 16px 24px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    transition: 0.2s;
}

.data-row.copied-row {
    border-color: rgba(255, 42, 109, 0.3);
    background: rgba(255, 42, 109, 0.08);
}

.country-pill {
    font-size: 13px;
    font-weight: 600;
    color: var(--accent-cyan);
    display: flex;
    align-items: center;
    gap: 8px;
}

.phone-val { font-size: 17px; font-weight: 700; letter-spacing: 0.5px; }

/* Action Grid */
.actions-panel {
    padding: 25px;
}

.input-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 15px;
    margin-bottom: 20px;
}

.button-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
}

/* Sidebar Text Area */
.paste-box {
    width: 100%;
    height: 140px;
    resize: none;
}

.proj-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
    max-height: 220px;
    overflow-y: auto;
}

.proj-item {
    padding: 12px 16px;
    cursor: pointer;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.proj-item.active-proj {
    border-color: var(--accent-cyan);
    background: rgba(0, 242, 254, 0.05);
}

@media(max-width: 1024px) {
    .app-container { flex-direction: column; }
    .sidebar { width: 100%; }
    .stats-container { grid-template-columns: repeat(2, 1fr); }
    .button-grid { grid-template-columns: repeat(2, 1fr); }
}
</style>
</head>

<body>

<div class="glow-orb-1"></div>
<div class="glow-orb-2"></div>
<div class="toast-container" id="toastBox"></div>

<!-- Login Overlay -->
<div class="login-screen" id="loginScreen">
    <div class="glass-card-3d login-box">
        <div class="brand-title">QYXNORA CORE</div>
        <div class="brand-sub">v3 Ultra Pro • Cyber Glass 3D</div>

        <input type="text" id="userInput" class="input-field" placeholder="Username">
        <input type="password" id="passInput" class="input-field" placeholder="Password" onkeypress="if(event.key==='Enter') login()">

        <button class="btn-3d btn-cyan" style="width: 100%; margin-top: 10px;" onclick="login()">Access System ⚡</button>
    </div>
</div>

<!-- Main App -->
<div class="app-container" id="appContainer">

    <!-- Sidebar -->
    <div class="sidebar">
        <div class="glass-card-3d user-profile">
            <span style="font-size: 13px; font-weight: 700; color: var(--accent-cyan);">👤 <span id="activeUser">User</span></span>
            <button class="btn-3d btn-rose" style="padding: 6px 12px; font-size: 11px;" onclick="logout()">Lock 🔒</button>
        </div>

        <div class="glass-card-3d" style="padding: 20px;">
            <div style="font-size: 12px; font-weight: 700; color: var(--accent-purple); margin-bottom: 12px;">+ PASTE DATA</div>
            <textarea id="rawInput" class="input-field paste-box" placeholder="Paste numbers or text data..." oninput="parseData()"></textarea>
            <input type="text" id="projTitle" class="input-field" placeholder="Project Name (Optional)" style="margin-bottom: 12px;">
            <button class="btn-3d btn-purple" style="width: 100%;" onclick="saveProject()">💾 Save Workspace</button>
        </div>

        <div style="font-size: 11px; font-weight: 700; color: var(--text-secondary); letter-spacing: 1px;">SAVED WORKSPACES</div>
        <div class="proj-list" id="projList"></div>
    </div>

    <!-- Main View -->
    <div class="main-view">
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <h1 style="font-size: 28px; font-weight: 900; background: linear-gradient(90deg, #fff, var(--text-secondary)); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">QyxnoraCore v3</h1>
        </div>

        <!-- 3D Stats -->
        <div class="stats-container">
            <div class="glass-card-3d stat-card-3d">
                <div class="stat-icon" style="color: var(--accent-cyan);">📊</div>
                <div><div class="stat-val" id="cntTotal">0</div><div class="stat-lbl">TOTAL NUMBERS</div></div>
            </div>
            <div class="glass-card-3d stat-card-3d">
                <div class="stat-icon" style="color: var(--accent-rose);">📋</div>
                <div><div class="stat-val" id="cntCopied">0</div><div class="stat-lbl">COPIED</div></div>
            </div>
            <div class="glass-card-3d stat-card-3d">
                <div class="stat-icon" style="color: var(--accent-purple);">⏳</div>
                <div><div class="stat-val" id="cntPending">0</div><div class="stat-lbl">REMAINING</div></div>
            </div>
            <div class="glass-card-3d stat-card-3d">
                <div class="stat-icon" style="color: #10b981;">🌐</div>
                <div><div class="stat-val" id="cntCountries">0</div><div class="stat-lbl">COUNTRIES</div></div>
            </div>
        </div>

        <!-- Controls -->
        <div class="controls-bar">
            <div class="search-box">
                <input type="text" id="searchKey" class="input-field" placeholder="Search number or country..." style="margin: 0;" oninput="render()">
            </div>
            <div class="filter-pills">
                <button class="pill-btn active" onclick="setFilter('all', this)">All</button>
                <button class="pill-btn" onclick="setFilter('pending', this)">Pending</button>
                <button class="pill-btn" onclick="setFilter('copied', this)">Copied</button>
            </div>
            <button class="btn-3d btn-emerald" onclick="exportTxt()">📥 Export TXT</button>
        </div>

        <!-- Data List -->
        <div class="data-list" id="dataList"></div>

        <!-- Action Panel -->
        <div class="glass-card-3d actions-panel">
            <div class="input-grid">
                <input id="prefixRemove" class="input-field" placeholder="Remove Prefix (e.g. 216)" style="margin: 0;">
                <input id="prefixAdd" class="input-field" placeholder="Add Prefix (e.g. 216)" style="margin: 0;">
            </div>
            <div class="button-grid">
                <button class="btn-3d btn-emerald" onclick="applyRemovePrefix()">Remove Prefix</button>
                <button class="btn-3d btn-cyan" onclick="applyAddPrefix()">Add Prefix</button>
                <button class="btn-3d btn-cyan" onclick="applyPlus(true)">Add +</button>
                <button class="btn-3d btn-rose" onclick="applyPlus(false)">Remove +</button>
                <button class="btn-3d btn-purple" onclick="deduplicate()">Remove Duplicate</button>
                <button class="btn-3d btn-purple" onclick="copyAllRemaining()">Copy All Pending</button>
                <button class="btn-3d btn-emerald" onclick="exportTxt()">Download TXT</button>
                <button class="btn-3d btn-rose" onclick="clearWorkspace()">Clear Workspace</button>
            </div>
        </div>
    </div>
</div>

<script>
// ================= USER DATABASE (15 USERS) =================
const USERS_DATABASE = [
    { username: "admin", password: "785" },
    { username: "rakib", password: "123" },
    { username: "mizan", password: "456" },
    { username: "tanvir", password: "101" },
    { username: "shakil", password: "102" },
    { username: "hasan", password: "103" },
    { username: "arif", password: "104" },
    { username: "faysal", password: "105" },
    { username: "sumon", password: "106" },
    { username: "imran", password: "107" },
    { username: "nahid", password: "108" },
    { username: "sabbir", password: "109" },
    { username: "joy", password: "110" },
    { username: "fahim", password: "111" },
    { username: "alamin", password: "112" }
];

let items = [];
let projects = JSON.parse(localStorage.getItem('qyx_v3_projects')) || [];
let activeProjIdx = -1;
let currentFilter = 'all';

const flags = {
    "Comoros":"🇰🇲","Tanzania":"🇹🇿","Palestine":"🇵🇸","Sri Lanka":"🇱🇰",
    "Cambodia":"🇰🇭","Malaysia":"🇲🇾","Algeria":"🇩🇿","Myanmar":"🇲🇲",
    "Angola":"🇦🇴","Afghanistan":"🇦🇫","Argentina":"🇦🇷","Armenia Karabakh":"🇦🇲",
    "Armenia":"🇦🇲","Azerbaijan":"🇦🇿","Belarus":"🇧🇾","Benin":"🇧🇯",
    "Bhutan":"🇧🇹","Bolivia":"🇧🇴","Bulgaria":"🇧🇬","Burkina":"🇧🇫",
    "Cameroon":"🇨🇲","Ecuador":"🇪🇨","Egypt":"🇪🇬","Ethiopia":"🇪🇹",
    "Gabon":"🇬🇦","Georgia":"🇬🇪","Germany":"🇩🇪","Guinea":"🇬🇳",
    "Indonesia":"🇮🇩","Iraq":"🇮🇶","Ivory Coast":"🇨🇮","Jordan":"🇯🇴",
    "Kazakhstan":"🇰🇿","Kenya":"🇰🇪","Kosovo":"🇽🇰","Kuwait":"🇰🇼",
    "Kyrgyzstan":"🇰🇬","Lesotho":"🇱🇸","Libya":"🇱🇾","Madagascar":"🇲🇬",
    "Mauritania":"🇲🇷","Moldova":"🇲🇩","Mongolia":"🇲🇳","Morocco":"🇲🇦",
    "Mozambique":"🇲🇿","Nepal":"🇳🇵","Niger":"🇳🇪","Nigeria":"🇳🇬",
    "Oman":"🇴🇲","Pakistan":"🇵🇰","Russia (Many Series)":"🇷🇺","Russia":"🇷🇺",
    "Saudi Arabia":"🇸🇦","Senegal":"🇸🇳","Slovenia (K)":"🇸🇮","Slovenia":"🇸🇮",
    "Sudan (Sudatel)":"🇸🇩","Sudan":"🇸🇩","Syria":"🇸🇾","Tajikistan":"🇹🇯",
    "Tunisia":"🇹🇳","Uganda":"🇺🇬","Ukraine":"🇺🇦","United Arab Emirates":"🇦🇪",
    "UAE":"🇦🇪","Uzbekistan":"🇺🇿","Vietnam (Mobifone)":"🇻🇳","Vietnam":"🇻🇳","Zimbabwe":"🇿🇼"
};

function showToast(msg) {
    const box = document.getElementById("toastBox");
    const t = document.createElement("div");
    t.className = "toast";
    t.innerText = msg;
    box.appendChild(t);
    setTimeout(() => t.remove(), 2500);
}

function login() {
    let u = document.getElementById("userInput").value.trim().toLowerCase();
    let p = document.getElementById("passInput").value.trim();
    let found = USERS_DATABASE.find(x => x.username === u && x.password === p);

    if(found) {
        sessionStorage.setItem("qyx_session", found.username);
        document.getElementById("loginScreen").style.display = "none";
        document.getElementById("appContainer").style.display = "flex";
        document.getElementById("activeUser").innerText = found.username.toUpperCase();
        showToast("Welcome Back, " + found.username.toUpperCase());
    } else {
        showToast("Invalid User Credentials!");
    }
}

function logout() {
    sessionStorage.removeItem("qyx_session");
    location.reload();
}

if(sessionStorage.getItem("qyx_session")) {
    document.getElementById("loginScreen").style.display = "none";
    document.getElementById("appContainer").style.display = "flex";
    document.getElementById("activeUser").innerText = sessionStorage.getItem("qyx_session").toUpperCase();
}

function detectCountry(str) {
    for(let c in flags) { if(str.includes(c)) return c; }
    return "Unknown";
}

function parseData() {
    activeProjIdx = -1;
    let txt = document.getElementById("rawInput").value;
    let lines = txt.split("\n");
    items = [];
    lines.forEach(l => {
        let m = l.match(/\d{8,15}/);
        if(m) items.push({ number: m[0], country: detectCountry(l), copied: false });
    });
    renderProjSidebar();
    render();
}

function render() {
    let list = document.getElementById("dataList");
    list.innerHTML = "";
    let q = document.getElementById("searchKey").value.toLowerCase();
    let countries = new Set();
    let copiedCnt = 0;

    items.forEach(i => {
        if(i.copied) copiedCnt++;
        countries.add(i.country);
    });

    let filtered = items.filter(i => {
        let match = i.number.toLowerCase().includes(q) || i.country.toLowerCase().includes(q);
        if(currentFilter === 'copied') return match && i.copied;
        if(currentFilter === 'pending') return match && !i.copied;
        return match;
    });

    filtered.forEach(i => {
        let flag = flags[i.country] || "🌍";
        let row = document.createElement("div");
        row.className = `glass-card-3d data-row ${i.copied ? 'copied-row' : ''}`;
        row.innerHTML = `
            <div style="display: flex; align-items: center; gap: 20px;">
                <div class="country-pill">${flag} ${i.country}</div>
                <div class="phone-val">${i.number}</div>
            </div>
            <button class="btn-3d ${i.copied ? 'btn-rose' : 'btn-cyan'}" style="padding: 8px 16px; font-size: 11px;" onclick="copySingle('${i.number}')">
                ${i.copied ? 'Copied ✓' : '📋 Copy'}
            </button>
        `;
        list.appendChild(row);
    });

    document.getElementById("cntTotal").innerText = items.length;
    document.getElementById("cntCopied").innerText = copiedCnt;
    document.getElementById("cntPending").innerText = items.length - copiedCnt;
    document.getElementById("cntCountries").innerText = countries.size;
}

function copySingle(num) {
    navigator.clipboard.writeText(num);
    let itm = items.find(x => x.number === num);
    if(itm) {
        itm.copied = true;
        syncWorkspace();
        render();
        showToast("Copied: " + num);
    }
}

function copyAllRemaining() {
    let list = items.filter(x => !x.copied).map(x => x.number);
    if(list.length === 0) return showToast("No pending numbers!");
    navigator.clipboard.writeText(list.join("\n"));
    items.forEach(x => x.copied = true);
    syncWorkspace();
    render();
    showToast("Copied All Pending Numbers!");
}

function applyRemovePrefix() {
    let p = document.getElementById("prefixRemove").value.trim();
    if(!p) return;
    items.forEach(i => { if(i.number.startsWith(p)) i.number = i.number.slice(p.length); });
    syncWorkspace();
    render();
    showToast("Prefix Removed!");
}

function applyAddPrefix() {
    let p = document.getElementById("prefixAdd").value.trim();
    if(!p) return;
    items.forEach(i => { i.number = p + i.number; });
    syncWorkspace();
    render();
    showToast("Prefix Added!");
}

function applyPlus(add) {
    items.forEach(i => {
        if(add && !i.number.startsWith("+")) i.number = "+" + i.number;
        if(!add) i.number = i.number.replace(/^\+/, '');
    });
    syncWorkspace();
    render();
    showToast(add ? "Added '+' Prefix" : "Removed '+' Prefix");
}

function deduplicate() {
    let before = items.length;
    let seen = new Set();
    items = items.filter(i => {
        if(seen.has(i.number)) return false;
        seen.add(i.number);
        return true;
    });
    syncWorkspace();
    render();
    showToast(`Removed ${before - items.length} Duplicates`);
}

function clearWorkspace() {
    items = [];
    document.getElementById("rawInput").value = "";
    syncWorkspace();
    render();
    showToast("Workspace Cleared");
}

function setFilter(f, btn) {
    currentFilter = f;
    document.querySelectorAll('.pill-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    render();
}

function saveProject() {
    let title = document.getElementById("projTitle").value.trim() || "Workspace " + (projects.length + 1);
    if(items.length === 0) return showToast("Paste data before saving!");
    projects.push({ name: title, items: JSON.parse(JSON.stringify(items)) });
    activeProjIdx = projects.length - 1;
    localStorage.setItem('qyx_v3_projects', JSON.stringify(projects));
    renderProjSidebar();
    showToast("Workspace Saved!");
}

function syncWorkspace() {
    if(activeProjIdx >= 0 && projects[activeProjIdx]) {
        projects[activeProjIdx].items = JSON.parse(JSON.stringify(items));
        localStorage.setItem('qyx_v3_projects', JSON.stringify(projects));
        renderProjSidebar();
    }
}

function renderProjSidebar() {
    let box = document.getElementById("projList");
    box.innerHTML = "";
    projects.forEach((p, idx) => {
        let div = document.createElement("div");
        div.className = `glass-card-3d proj-item ${idx === activeProjIdx ? 'active-proj' : ''}`;
        div.onclick = () => {
            activeProjIdx = idx;
            items = JSON.parse(JSON.stringify(p.items));
            renderProjSidebar();
            render();
        };
        div.innerHTML = `
            <span style="font-size: 12px; font-weight: 700;">📁 ${p.name}</span>
            <span style="font-size: 10px; color: var(--text-secondary);">${p.items.length} items</span>
        `;
        box.appendChild(div);
    });
}

function exportTxt() {
    if(items.length === 0) return showToast("No data to export!");
    let blob = new Blob([items.map(x => x.number).join("\n")], {type: "text/plain"});
    let a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = `qyxnora_export.txt`;
    a.click();
}

renderProjSidebar();
render();
</script>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QyxnoraCore v3 Exact Dashboard UI</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
:root {
    --bg-dark: #05070e;
    --sidebar-bg: #090c15;
    --card-bg: #0f1422;
    --card-border: #1a233a;
    --accent-purple: #7C3AED;
    --accent-cyan: #0284C7;
    --accent-emerald: #059669;
    --accent-rose: #E11D48;
    --text-primary: #F8FAFC;
    --text-muted: #64748B;
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
}

body {
    background: var(--bg-dark);
    color: var(--text-primary);
    min-height: 100vh;
    display: flex;
    overflow-x: hidden;
}

.toast-container {
    position: fixed;
    top: 20px;
    right: 20px;
    z-index: 999999;
    display: flex;
    flex-direction: column;
    gap: 8px;
}
.toast {
    background: #182238;
    border-left: 4px solid var(--accent-purple);
    color: #fff;
    padding: 12px 18px;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 600;
    box-shadow: 0 10px 25px rgba(0,0,0,0.5);
}

/* Lock / Login Screen */
.login-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    background: var(--bg-dark);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 99999;
}
.login-card {
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    padding: 30px;
    border-radius: 16px;
    width: 340px;
    display: flex;
    flex-direction: column;
    gap: 16px;
    box-shadow: 0 20px 40px rgba(0,0,0,0.6);
}
.login-card h2 { font-size: 20px; text-align: center; color: #fff; }
.login-card input {
    width: 100%;
    background: #070912;
    border: 1px solid var(--card-border);
    padding: 10px 14px;
    border-radius: 8px;
    color: #fff;
    font-size: 13px;
    outline: none;
}

.app-layout {
    display: none; /* Login required to display */
    width: 100vw;
    min-height: 100vh;
}

.sidebar {
    width: 250px;
    background: var(--sidebar-bg);
    border-right: 1px solid var(--card-border);
    display: flex;
    flex-direction: column;
    padding: 16px 12px;
    gap: 15px;
    flex-shrink: 0;
}

.brand {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 18px;
    font-weight: 800;
    color: #fff;
    padding: 8px 10px;
}
.brand-badge {
    background: #8B5CF6;
    font-size: 10px;
    padding: 2px 6px;
    border-radius: 6px;
}

.nav-group {
    display: flex;
    flex-direction: column;
    gap: 2px;
}
.nav-title {
    font-size: 10px;
    font-weight: 800;
    color: var(--text-muted);
    letter-spacing: 1px;
    margin: 12px 0 6px 10px;
    text-transform: uppercase;
}
.nav-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 9px 12px;
    border-radius: 8px;
    color: #94A3B8;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: 0.15s;
    text-decoration: none;
}
.nav-item:hover { background: rgba(255, 255, 255, 0.04); color: #fff; }
.nav-item.active {
    background: linear-gradient(90deg, rgba(124, 58, 237, 0.25), rgba(124, 58, 237, 0.05));
    border: 1px solid rgba(124, 58, 237, 0.4);
    color: #fff;
}

.main-content {
    flex: 1;
    display: flex;
    flex-direction: column;
    height: 100vh;
    overflow-y: auto;
}

.top-header {
    height: 60px;
    border-bottom: 1px solid var(--card-border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 24px;
    background: var(--sidebar-bg);
}

.search-box { position: relative; width: 340px; }
.search-box input {
    width: 100%;
    background: #080B13;
    border: 1px solid var(--card-border);
    padding: 8px 12px 8px 36px;
    border-radius: 8px;
    color: #fff;
    font-size: 12px;
    outline: none;
}
.search-box i {
    position: absolute;
    left: 12px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--text-muted);
    font-size: 13px;
}

.user-area { display: flex; align-items: center; gap: 16px; }
.avatar {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    background: linear-gradient(135deg, #7C3AED, #2563EB);
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 13px;
}

.container { padding: 20px 24px; display: flex; flex-direction: column; gap: 16px; }

.stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
.stat-card {
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 10px;
    padding: 12px;
    display: flex;
    align-items: center;
    gap: 10px;
}
.stat-icon {
    width: 34px;
    height: 34px;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
}

.paste-card {
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 14px;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
}
.paste-layout { display: flex; gap: 12px; }
.paste-box {
    flex: 1;
    background: #070912;
    border: 1px solid var(--card-border);
    border-radius: 8px;
    padding: 12px;
    color: #fff;
    font-size: 13px;
    min-height: 120px;
    outline: none;
    resize: vertical;
}

.ws-list { display: flex; gap: 10px; overflow-x: auto; }
.ws-item {
    min-width: 180px;
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    padding: 10px 14px;
    border-radius: 10px;
    cursor: pointer;
    display: flex;
    justify-content: space-between;
    align-items: center;
}
.ws-item.active { border-color: var(--accent-purple); background: rgba(124, 58, 237, 0.1); }

/* Filter Tabs */
.filter-bar { display: flex; gap: 8px; margin-bottom: 12px; }
.filter-btn {
    background: #090c15;
    border: 1px solid var(--card-border);
    color: var(--text-muted);
    padding: 6px 14px;
    border-radius: 6px;
    font-size: 11px;
    font-weight: 700;
    cursor: pointer;
}
.filter-btn.active {
    background: var(--accent-purple);
    color: #fff;
    border-color: var(--accent-purple);
}

.table-card {
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 14px;
    overflow: hidden;
    padding: 12px;
}
table { width: 100%; border-collapse: collapse; text-align: left; font-size: 12px; }
th { background: #090c15; padding: 10px 14px; color: var(--text-muted); font-weight: 600; border-bottom: 1px solid var(--card-border); }
td { padding: 10px 14px; border-bottom: 1px solid var(--card-border); }

.btn {
    padding: 8px 14px;
    border: none;
    border-radius: 8px;
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    color: #fff;
}
.btn-purple { background: var(--accent-purple); }
.btn-cyan { background: var(--accent-cyan); }
.btn-emerald { background: var(--accent-emerald); }
.btn-rose { background: var(--accent-rose); }

.badge-status { padding: 3px 8px; border-radius: 12px; font-size: 10px; font-weight: 700; }
.badge-copied { background: rgba(5, 150, 105, 0.15); color: #10B981; }
.badge-pending { background: rgba(225, 29, 72, 0.15); color: #F43F5E; }

.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 10px; }
</style>
</head>

<body>

<div class="toast-container" id="toastBox"></div>

<!-- Login Lock Overlay -->
<div class="login-overlay" id="loginOverlay">
    <div class="login-card">
        <h2><i class="fa-solid fa-lock" style="color:#8B5CF6;"></i> Username Unlock</h2>
        <input type="text" id="loginUser" placeholder="Enter Username..." onkeypress="if(event.key==='Enter') handleLogin()">
        <button class="btn btn-purple" onclick="handleLogin()"><i class="fa-solid fa-key"></i> Unlock Dashboard</button>
    </div>
</div>

<div class="app-layout" id="appLayout">
    <div class="sidebar">
        <div class="brand">
            <i class="fa-solid fa-gem" style="color: #8B5CF6;"></i>
            QyxnoraCore <span class="brand-badge">v3</span>
        </div>
        <div class="nav-group">
            <a class="nav-item active"><i class="fa-solid fa-house"></i> Dashboard</a>
            <div class="nav-title">WORKSPACE</div>
            <a class="nav-item" onclick="deduplicate()"><i class="fa-solid fa-copy"></i> Remove Duplicate</a>
            <a class="nav-item" onclick="copyAllRemaining()"><i class="fa-solid fa-clipboard-check"></i> Copy All Pending</a>
            <a class="nav-item" onclick="exportTxt()"><i class="fa-solid fa-file-arrow-down"></i> Download TXT</a>
            <a class="nav-item" onclick="clearWorkspace()"><i class="fa-solid fa-trash-can"></i> Clear Workspace</a>
            <div class="nav-title">ACCOUNT</div>
            <a class="nav-item" onclick="handleLogout()"><i class="fa-solid fa-power-off" style="color: var(--accent-rose);"></i> Lock Screen</a>
        </div>
    </div>

    <div class="main-content">
        <div class="top-header">
            <div class="search-box">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" id="searchKey" placeholder="Search number or country..." oninput="render()">
            </div>
            <div class="user-area">
                <div class="avatar" id="userAvatar">A</div>
            </div>
        </div>

        <div class="container">
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-icon" style="background: rgba(124, 58, 237, 0.2); color: #8B5CF6;"><i class="fa-solid fa-chart-simple"></i></div>
                    <div><div style="font-size: 16px; font-weight: 800;" id="cntTotal">0</div><div style="font-size: 9px; color: var(--text-muted);">TOTAL</div></div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon" style="background: rgba(5, 150, 105, 0.2); color: #10B981;"><i class="fa-solid fa-check"></i></div>
                    <div><div style="font-size: 16px; font-weight: 800;" id="cntCopied">0</div><div style="font-size: 9px; color: var(--text-muted);">COPIED</div></div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon" style="background: rgba(225, 29, 72, 0.2); color: #F43F5E;"><i class="fa-solid fa-hourglass-half"></i></div>
                    <div><div style="font-size: 16px; font-weight: 800;" id="cntPending">0</div><div style="font-size: 9px; color: var(--text-muted);">PENDING</div></div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon" style="background: rgba(2, 132, 199, 0.2); color: #38BDF8;"><i class="fa-solid fa-globe"></i></div>
                    <div><div style="font-size: 16px; font-weight: 800;" id="cntCountries">0</div><div style="font-size: 9px; color: var(--text-muted);">COUNTRIES</div></div>
                </div>
            </div>

            <div class="paste-card">
                <div style="font-size: 12px; font-weight: 700;">Paste Your Data</div>
                <div class="paste-layout">
                    <textarea id="rawInput" class="paste-box" placeholder="Paste data here..." oninput="parseData()"></textarea>
                    <div style="width:180px; display:flex; flex-direction:column; gap:8px;">
                        <input type="text" id="projTitle" style="background:#070912; border:1px solid var(--card-border); padding:8px 10px; border-radius:6px; color:#fff; font-size:11px;" placeholder="Workspace Name">
                        <button class="btn btn-purple" onclick="saveProject()"><i class="fa-solid fa-floppy-disk"></i> Save Workspace</button>
                    </div>
                </div>
            </div>

            <div>
                <div style="font-size: 11px; font-weight: 700; color: var(--text-muted); margin-bottom: 8px;">SAVED WORKSPACES</div>
                <div class="ws-list" id="projList"></div>
            </div>

            <div class="table-card">
                <!-- Copied / Pending Filter Tabs -->
                <div class="filter-bar">
                    <button class="filter-btn active" id="filterAllBtn" onclick="setFilter('all')">All Numbers</button>
                    <button class="filter-btn" id="filterPendingBtn" onclick="setFilter('pending')">All Pending (সিরিয়াল)</button>
                    <button class="filter-btn" id="filterCopiedBtn" onclick="setFilter('copied')">All Copied (সিরিয়াল)</button>
                </div>

                <table>
                    <thead>
                        <tr>
                            <th>Country</th>
                            <th>Number</th>
                            <th>Status</th>
                            <th style="text-align: right;">Action</th>
                        </tr>
                    </thead>
                    <tbody id="dataTable"></tbody>
                </table>
            </div>

            <div class="paste-card">
                <div class="grid-2">
                    <input type="text" id="prefixRemove" placeholder="Remove Prefix (e.g. 216)" style="background:#070912; border:1px solid var(--card-border); padding:8px 10px; border-radius:6px; color:#fff; font-size:11px;">
                    <input type="text" id="prefixAdd" placeholder="Add Prefix (e.g. 216)" style="background:#070912; border:1px solid var(--card-border); padding:8px 10px; border-radius:6px; color:#fff; font-size:11px;">
                </div>
                <div class="grid-4">
                    <button class="btn btn-emerald" onclick="applyRemovePrefix()"><i class="fa-solid fa-eraser"></i> Remove Prefix</button>
                    <button class="btn btn-cyan" onclick="applyAddPrefix()"><i class="fa-solid fa-plus"></i> Add Prefix</button>
                    <button class="btn btn-cyan" onclick="applyPlus(true)">Add +</button>
                    <button class="btn btn-rose" onclick="applyPlus(false)">Remove +</button>
                    <button class="btn btn-purple" onclick="deduplicate()"><i class="fa-solid fa-clone"></i> Remove Duplicate</button>
                    <button class="btn btn-purple" onclick="copyAllRemaining()"><i class="fa-solid fa-copy"></i> Copy All Pending</button>
                    <button class="btn btn-emerald" onclick="exportTxt()"><i class="fa-solid fa-file-export"></i> Download TXT</button>
                    <button class="btn btn-rose" onclick="clearWorkspace()"><i class="fa-solid fa-trash"></i> Clear Workspace</button>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
const validUsers = [
    "QyxnoraCore", "Rafin2332", "Salma89340", "Tanvir1234", "MFaheem123", "Mahmudsakib"
];

const UNLOCK_DURATION = 2 * 60 * 60 * 1000; // 2 hours in ms

let items = [];
let projects = JSON.parse(localStorage.getItem('qyx_exact_projects')) || [];
let activeProjIdx = -1;
let currentFilter = 'all';

const flags = {
    "Comoros": "🇰🇲", "Tanzania": "🇹🇿", "Palestine": "🇵🇸", "Sri Lanka": "🇱🇰",
    "Cambodia": "🇰🇭", "Malaysia": "🇲🇾", "Algeria": "🇩🇿", "Myanmar": "🇲🇲",
    "Angola": "🇦🇴", "Afghanistan": "🇦🇫", "Argentina": "🇦🇷", "Armenia Karabakh": "🇦🇲",
    "Azerbaijan": "🇦🇿", "Belarus": "🇧🇾", "Benin": "🇧🇯", "Bhutan": "🇧🇹",
    "Bolivia": "🇧🇴", "Bulgaria": "🇧🇬", "Burkina Faso": "🇧🇫", "Cameroon": "🇨🇲",
    "Ecuador": "🇪🇨", "Egypt": "🇪🇬", "Ethiopia": "🇪🇹", "Gabon": "🇬🇦",
    "Georgia": "🇬🇪", "Germany": "🇩🇪", "Guinea": "🇬🇳", "Indonesia": "🇮🇩",
    "Iraq": "🇮🇶", "Ivory Coast": "🇨🇮", "Jordan": "🇯🇴", "Kazakhstan": "🇰🇿",
    "Kenya": "🇰🇪", "Kosovo": "🇽🇰", "Kuwait": "🇰🇼", "Kyrgyzstan": "🇰🇬",
    "Lesotho": "🇱🇸", "Libya": "🇱🇾", "Madagascar": "🇲🇬", "Mauritania": "🇲🇷",
    "Moldova": "🇲🇩", "Mongolia": "🇲🇳", "Morocco": "🇲🇦", "Mozambique": "🇲🇿",
    "Nepal": "🇳🇵", "Niger": "🇳🇪", "Nigeria": "🇳🇬", "Oman": "🇴🇲",
    "Pakistan": "🇵🇰", "Russia": "🇷🇺", "Saudi Arabia": "🇸🇦", "Senegal": "🇸🇳",
    "Slovenia": "🇸🇮", "Sudan": "🇸🇩", "Syria": "🇸🇾", "Tajikistan": "🇹🇯",
    "Tunisia": "🇹🇳", "Uganda": "🇺🇬", "Ukraine": "🇺🇦", "United Arab Emirates": "🇦🇪",
    "UAE": "🇦🇪", "Uzbekistan": "🇺🇿", "Vietnam": "🇻🇳", "Zimbabwe": "🇿🇼"
};

function showToast(msg) {
    const box = document.getElementById("toastBox");
    const t = document.createElement("div");
    t.className = "toast";
    t.innerText = msg;
    box.appendChild(t);
    setTimeout(() => t.remove(), 2000);
}

// Lock / Login Logic
window.onload = function() {
    const savedUser = localStorage.getItem('activeUser');
    const unlockTime = localStorage.getItem('unlockTimestamp');

    if (savedUser && unlockTime) {
        const now = new Date().getTime();
        if ((now - parseInt(unlockTime)) < UNLOCK_DURATION) {
            loginSuccess(savedUser);
            return;
        } else {
            localStorage.removeItem('activeUser');
            localStorage.removeItem('unlockTimestamp');
            showToast("Session expired. Please unlock again.");
        }
    }
}

function handleLogin() {
    const val = document.getElementById('loginUser').value.trim();
    if (validUsers.includes(val)) {
        localStorage.setItem('activeUser', val);
        localStorage.setItem('unlockTimestamp', new Date().getTime().toString());
        loginSuccess(val);
        showToast("Unlocked successfully!");
    } else {
        alert("Invalid Username!");
    }
}

function loginSuccess(user) {
    document.getElementById('userAvatar').innerText = user.charAt(0).toUpperCase();
    document.getElementById('loginOverlay').style.display = 'none';
    document.getElementById('appLayout').style.display = 'flex';
    renderProjSidebar();
    render();
}

function handleLogout() {
    localStorage.removeItem('activeUser');
    localStorage.removeItem('unlockTimestamp');
    location.reload();
}

function detectCountry(str) {
    if (!str) return "Unknown";
    for (let c in flags) {
        if (str.toLowerCase().includes(c.toLowerCase())) return c;
    }
    let match = str.trim().match(/^([A-Za-z]+)/);
    return match ? match[1] : "Unknown";
}

function parseData() {
    activeProjIdx = -1;
    let txt = document.getElementById("rawInput").value;
    let lines = txt.split("\n");
    items = [];

    lines.forEach(l => {
        let trimmed = l.trim();
        if (!trimmed) return;

        let countryName = detectCountry(trimmed);
        let matches = trimmed.match(/\d{8,15}/g);
        
        if (matches && matches.length > 0) {
            let targetNumber = matches.reduce((a, b) => a.length >= b.length ? a : b);

            items.push({
                number: targetNumber,
                country: countryName,
                copied: false
            });
        }
    });

    renderProjSidebar();
    render();
}

function setFilter(type) {
    currentFilter = type;
    document.getElementById('filterAllBtn').classList.toggle('active', type === 'all');
    document.getElementById('filterPendingBtn').classList.toggle('active', type === 'pending');
    document.getElementById('filterCopiedBtn').classList.toggle('active', type === 'copied');
    render();
}

function render() {
    let tbody = document.getElementById("dataTable");
    tbody.innerHTML = "";
    let q = document.getElementById("searchKey").value.toLowerCase();
    let countries = new Set();
    let copiedCnt = 0;

    items.forEach(i => {
        if(i.copied) copiedCnt++;
        countries.add(i.country);
    });

    let filtered = items.filter(i => {
        let matchQuery = i.number.toLowerCase().includes(q) || i.country.toLowerCase().includes(q);
        if (!matchQuery) return false;

        if (currentFilter === 'pending') return !i.copied;
        if (currentFilter === 'copied') return i.copied;
        return true;
    });

    filtered.forEach(i => {
        let flag = flags[i.country] || "🌍";
        let tr = document.createElement("tr");
        tr.innerHTML = `
            <td><span style="font-size:13px; margin-right:4px;">${flag}</span> ${i.country}</td>
            <td style="font-weight:700;">${i.number}</td>
            <td>
                <span class="badge-status ${i.copied ? 'badge-copied' : 'badge-pending'}">
                    ${i.copied ? 'Copied ✓' : 'Pending'}
                </span>
            </td>
            <td style="text-align: right;">
                <button class="btn ${i.copied ? 'btn-rose' : 'btn-cyan'}" style="padding:3px 8px; font-size:10px;" onclick="copySingle('${i.number}')">
                    ${i.copied ? 'Copied' : 'Copy'}
                </button>
            </td>
        `;
        tbody.appendChild(tr);
    });

    document.getElementById("cntTotal").innerText = items.length;
    document.getElementById("cntCopied").innerText = copiedCnt;
    document.getElementById("cntPending").innerText = items.length - copiedCnt;
    document.getElementById("cntCountries").innerText = countries.size;
}

function copySingle(num) {
    navigator.clipboard.writeText(num);
    let itm = items.find(x => x.number === num);
    if(itm) {
        itm.copied = true;
        syncWorkspace();
        render();
        showToast("Copied!");
    }
}

function copyAllRemaining() {
    let list = items.filter(x => !x.copied).map(x => x.number);
    if(list.length === 0) return showToast("No pending numbers!");
    navigator.clipboard.writeText(list.join("\n"));
    items.forEach(x => x.copied = true);
    syncWorkspace();
    render();
    showToast("Copied All!");
}

function applyRemovePrefix() {
    let p = document.getElementById("prefixRemove").value.trim();
    if(!p) return;
    items.forEach(i => { if(i.number.startsWith(p)) i.number = i.number.slice(p.length); });
    syncWorkspace();
    render();
    showToast("Prefix Removed!");
}

function applyAddPrefix() {
    let p = document.getElementById("prefixAdd").value.trim();
    if(!p) return;
    items.forEach(i => { i.number = p + i.number; });
    syncWorkspace();
    render();
    showToast("Prefix Added!");
}

function applyPlus(add) {
    items.forEach(i => {
        if(add && !i.number.startsWith("+")) i.number = "+" + i.number;
        if(!add) i.number = i.number.replace(/^\+/, '');
    });
    syncWorkspace();
    render();
    showToast(add ? "Added '+'" : "Removed '+'");
}

function deduplicate() {
    let before = items.length;
    let seen = new Set();
    items = items.filter(i => {
        if(seen.has(i.number)) return false;
        seen.add(i.number);
        return true;
    });
    syncWorkspace();
    render();
    showToast(`Removed ${before - items.length} Duplicates`);
}

function clearWorkspace() {
    items = [];
    document.getElementById("rawInput").value = "";
    syncWorkspace();
    render();
    showToast("Cleared!");
}

function saveProject() {
    let title = document.getElementById("projTitle").value.trim() || "Workspace " + (projects.length + 1);
    if(items.length === 0) return showToast("No data to save!");
    projects.push({ name: title, items: JSON.parse(JSON.stringify(items)) });
    activeProjIdx = projects.length - 1;
    localStorage.setItem('qyx_exact_projects', JSON.stringify(projects));
    renderProjSidebar();
    showToast("Saved Workspace!");
}

function deleteProject(e, idx) {
    e.stopPropagation();
    projects.splice(idx, 1);
    if(activeProjIdx === idx) {
        items = [];
        activeProjIdx = -1;
        document.getElementById("rawInput").value = "";
    } else if(activeProjIdx > idx) {
        activeProjIdx--;
    }
    localStorage.setItem('qyx_exact_projects', JSON.stringify(projects));
    renderProjSidebar();
    render();
    showToast("Deleted!");
}

function syncWorkspace() {
    if(activeProjIdx >= 0 && projects[activeProjIdx]) {
        projects[activeProjIdx].items = JSON.parse(JSON.stringify(items));
        localStorage.setItem('qyx_exact_projects', JSON.stringify(projects));
        renderProjSidebar();
    }
}

function renderProjSidebar() {
    let box = document.getElementById("projList");
    box.innerHTML = "";
    projects.forEach((p, idx) => {
        let div = document.createElement("div");
        div.className = `ws-item ${idx === activeProjIdx ? 'active' : ''}`;
        div.onclick = () => {
            activeProjIdx = idx;
            items = JSON.parse(JSON.stringify(p.items));
            renderProjSidebar();
            render();
        };
        div.innerHTML = `
            <div>
                <div style="font-size: 11px; font-weight: 700;">📁 ${p.name}</div>
                <div style="font-size: 9px; color: var(--text-muted);">${p.items.length} Numbers</div>
            </div>
            <i class="fa-solid fa-trash" style="color: var(--accent-rose); font-size: 11px;" onclick="deleteProject(event, ${idx})"></i>
        `;
        box.appendChild(div);
    });
}

function exportTxt() {
    if(items.length === 0) return showToast("No data!");
    let blob = new Blob([items.map(x => x.number).join("\n")], {type: "text/plain"});
    let a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = `export.txt`;
    a.click();
}
</script>

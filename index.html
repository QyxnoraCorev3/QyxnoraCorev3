<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QyxnoraCore v3.0 - Ultra Premium UI</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<style>
/* ================= Phase 1: Color System & Global Styling ================= */
:root {
    --bg-dark: #030712;
    --sidebar-bg: rgba(15, 23, 42, 0.75);
    --card-bg: rgba(15, 23, 42, 0.6);
    --card-border: rgba(255, 255, 255, 0.08);
    --accent-purple: #8B5CF6;
    --accent-purple-glow: rgba(139, 92, 246, 0.5);
    --accent-cyan: #06B6D4;
    --accent-emerald: #10B981;
    --accent-rose: #F43F5E;
    --accent-amber: #F59E0B;
    --text-primary: #F8FAFC;
    --text-muted: #94A3B8;
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Plus Jakarta Sans', sans-serif;
}

body {
    background: var(--bg-dark);
    color: var(--text-primary);
    min-height: 100vh;
    display: flex;
    overflow-x: hidden;
    position: relative;
}

/* Aurora Glow Background Effect */
body::before {
    content: '';
    position: fixed;
    top: -20%; left: -10%;
    width: 600px; height: 600px;
    background: radial-gradient(circle, rgba(139, 92, 246, 0.25), transparent 70%);
    filter: blur(80px);
    z-index: -1;
    animation: auroraFloat 12s ease-in-out infinite alternate;
}
body::after {
    content: '';
    position: fixed;
    bottom: -20%; right: -10%;
    width: 600px; height: 600px;
    background: radial-gradient(circle, rgba(6, 182, 212, 0.2), transparent 70%);
    filter: blur(80px);
    z-index: -1;
    animation: auroraFloat 15s ease-in-out infinite alternate-reverse;
}

@keyframes auroraFloat {
    0% { transform: translate(0, 0) scale(1); }
    100% { transform: translate(60px, 40px) scale(1.1); }
}

/* Glassmorphism Common Utilities */
.glass-panel {
    background: var(--card-bg);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid var(--card-border);
    box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
    border-radius: 20px;
}

/* ================= Phase 5: Notifications & Overlay ================= */
.toast-container {
    position: fixed;
    top: 20px; right: 20px;
    z-index: 99999;
    display: flex;
    flex-direction: column;
    gap: 10px;
}
.toast {
    background: rgba(15, 23, 42, 0.9);
    border: 1px solid var(--accent-purple);
    color: #fff;
    padding: 14px 22px;
    border-radius: 14px;
    font-size: 13px;
    font-weight: 600;
    box-shadow: 0 10px 25px var(--accent-purple-glow);
    backdrop-filter: blur(10px);
    animation: slideIn 0.3s cubic-bezier(0.18, 0.89, 0.32, 1.28);
}
@keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

.login-overlay {
    position: fixed;
    inset: 0;
    background: rgba(3, 7, 18, 0.95);
    backdrop-filter: blur(20px);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 99999;
}
.login-card {
    padding: 40px;
    width: 380px;
    text-align: center;
    display: flex;
    flex-direction: column;
    gap: 20px;
}

.app-layout {
    display: none;
    width: 100vw;
    min-height: 100vh;
}

/* ================= Phase 1: Sidebar Design ================= */
.sidebar {
    width: 270px;
    background: var(--sidebar-bg);
    border-right: 1px solid var(--card-border);
    display: flex;
    flex-direction: column;
    padding: 24px 18px;
    gap: 24px;
    flex-shrink: 0;
    position: relative;
    z-index: 100;
    transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
}

.brand {
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 20px;
    font-weight: 800;
    letter-spacing: -0.5px;
}
.brand i { color: var(--accent-purple); filter: drop-shadow(0 0 10px var(--accent-purple-glow)); }
.brand-badge {
    background: linear-gradient(135deg, var(--accent-purple), var(--accent-cyan));
    font-size: 10px;
    padding: 2px 8px;
    border-radius: 20px;
    font-weight: 700;
}

.nav-title {
    font-size: 10px;
    font-weight: 800;
    color: var(--text-muted);
    letter-spacing: 1.5px;
    margin: 12px 0 6px 12px;
}
.nav-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 16px;
    border-radius: 14px;
    color: var(--text-muted);
    font-size: 13.5px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
    text-decoration: none;
}
.nav-item:hover { background: rgba(255, 255, 255, 0.04); color: #fff; }
.nav-item.active {
    background: linear-gradient(135deg, var(--accent-purple), #6366F1);
    color: #fff;
    box-shadow: 0 4px 20px var(--accent-purple-glow);
}

/* Sidebar Glowing Diamond Art */
.sidebar-diamond-art {
    margin-top: auto;
    height: 150px;
    border-radius: 18px;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    background: radial-gradient(circle, rgba(139, 92, 246, 0.15) 0%, transparent 80%);
    border: 1px solid rgba(139, 92, 246, 0.2);
}
.diamond-icon {
    font-size: 45px;
    color: #A78BFA;
    filter: drop-shadow(0 0 20px var(--accent-purple-glow));
    animation: floatGlow 4s ease-in-out infinite alternate;
}
@keyframes floatGlow {
    0% { transform: translateY(0) scale(1); filter: drop-shadow(0 0 10px var(--accent-purple-glow)); }
    100% { transform: translateY(-8px) scale(1.05); filter: drop-shadow(0 0 25px var(--accent-purple)); }
}

/* ================= Phase 1 & 2: Header & Main Area ================= */
.main-content {
    flex: 1;
    display: flex;
    flex-direction: column;
    height: 100vh;
    overflow-y: auto;
}

.top-header {
    height: 75px;
    border-bottom: 1px solid var(--card-border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 30px;
    background: rgba(3, 7, 18, 0.7);
    backdrop-filter: blur(15px);
    position: sticky;
    top: 0;
    z-index: 90;
}

.search-box {
    position: relative;
    width: 320px;
}
.search-box input {
    width: 100%;
    background: rgba(15, 23, 42, 0.6);
    border: 1px solid var(--card-border);
    padding: 10px 16px 10px 42px;
    border-radius: 12px;
    color: #fff;
    font-size: 13px;
    outline: none;
    transition: 0.2s;
}
.search-box input:focus { border-color: var(--accent-purple); box-shadow: 0 0 15px var(--accent-purple-glow); }
.search-box i { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--text-muted); }

.container { padding: 30px; display: flex; flex-direction: column; gap: 24px; }

/* ================= Phase 2: Dashboard Stats ================= */
.stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 18px; }
.stat-card {
    padding: 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    position: relative;
    overflow: hidden;
    transition: transform 0.2s;
}
.stat-card:hover { transform: translateY(-3px); }
.stat-card .val { font-size: 26px; font-weight: 800; margin-top: 4px; }

/* Neon Glows for Stat Icons */
.stat-icon {
    width: 48px; height: 48px;
    border-radius: 14px;
    display: flex; align-items: center; justify-content: center;
    font-size: 20px;
}
.purple .stat-icon { background: rgba(139, 92, 246, 0.15); color: var(--accent-purple); box-shadow: 0 0 15px rgba(139, 92, 246, 0.2); }
.emerald .stat-icon { background: rgba(16, 185, 129, 0.15); color: var(--accent-emerald); box-shadow: 0 0 15px rgba(16, 185, 129, 0.2); }
.amber .stat-icon { background: rgba(245, 158, 11, 0.15); color: var(--accent-amber); box-shadow: 0 0 15px rgba(245, 158, 11, 0.2); }
.cyan .stat-icon { background: rgba(6, 182, 212, 0.15); color: var(--accent-cyan); box-shadow: 0 0 15px rgba(6, 182, 212, 0.2); }

/* ================= Phase 2: Data Input & Workspace ================= */
.paste-layout { display: flex; gap: 20px; margin-top: 10px; }
.paste-box {
    flex: 1;
    background: rgba(3, 7, 18, 0.5);
    border: 1px solid var(--card-border);
    border-radius: 14px;
    padding: 16px;
    color: #fff;
    font-size: 13px;
    min-height: 140px;
    outline: none;
    resize: vertical;
    transition: 0.2s;
}
.paste-box:focus { border-color: var(--accent-purple); box-shadow: 0 0 15px var(--accent-purple-glow); }

.workspace-inputs { width: 280px; display: flex; flex-direction: column; gap: 14px; }
.workspace-inputs input {
    background: rgba(3, 7, 18, 0.5);
    border: 1px solid var(--card-border);
    border-radius: 12px;
    padding: 12px 16px;
    color: #fff;
    font-size: 13px;
    outline: none;
}

.ws-list { display: flex; gap: 12px; overflow-x: auto; padding-bottom: 4px; }
.ws-item {
    min-width: 180px;
    background: rgba(15, 23, 42, 0.8);
    border: 1px solid var(--card-border);
    padding: 12px 16px;
    border-radius: 14px;
    cursor: pointer;
    display: flex;
    justify-content: space-between;
    align-items: center;
}
.ws-item.active { border-color: var(--accent-purple); background: rgba(139, 92, 246, 0.15); }

/* Modern Tabs */
.filter-bar {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    background: rgba(3, 7, 18, 0.6);
    padding: 6px;
    border-radius: 16px;
    border: 1px solid var(--card-border);
}
.filter-btn {
    background: transparent;
    border: none;
    color: var(--text-muted);
    padding: 12px;
    border-radius: 12px;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    transition: 0.2s;
}
.filter-btn.active {
    background: linear-gradient(135deg, var(--accent-purple), #6366F1);
    color: #fff;
    box-shadow: 0 4px 15px var(--accent-purple-glow);
}

/* ================= Phase 3: Data Table ================= */
.table-card { padding: 10px; overflow-x: auto; }
table { width: 100%; border-collapse: collapse; text-align: left; font-size: 13px; min-width: 650px; }
th { padding: 14px 18px; color: var(--text-muted); font-size: 11px; text-transform: uppercase; letter-spacing: 0.8px; border-bottom: 1px solid var(--card-border); }
td { padding: 14px 18px; border-bottom: 1px solid rgba(255,255,255,0.02); }
tr:hover td { background: rgba(255, 255, 255, 0.02); }

.badge-status {
    padding: 4px 10px;
    border-radius: 20px;
    font-size: 11px;
    font-weight: 700;
    display: inline-flex;
    align-items: center;
    gap: 6px;
}
.badge-copied { background: rgba(16, 185, 129, 0.15); color: var(--accent-emerald); border: 1px solid rgba(16, 185, 129, 0.3); }
.badge-pending { background: rgba(245, 158, 11, 0.15); color: var(--accent-amber); border: 1px solid rgba(245, 158, 11, 0.3); }

/* ================= Phase 4: Tools & Action Buttons ================= */
.prefix-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.prefix-box {
    background: rgba(3, 7, 18, 0.5);
    border: 1px solid var(--card-border);
    border-radius: 12px;
    padding: 8px 12px;
    display: flex;
    align-items: center;
}
.prefix-box input { background: transparent; border: none; color: #fff; outline: none; width: 100%; font-size: 13px; }

.buttons-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }

.btn {
    padding: 14px 18px;
    border: none;
    border-radius: 14px;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    color: #fff;
    transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
}
.btn:hover { transform: translateY(-2px); filter: brightness(1.1); }

.btn-purple { background: linear-gradient(135deg, var(--accent-purple), #6366F1); box-shadow: 0 4px 15px var(--accent-purple-glow); }
.btn-emerald { background: linear-gradient(135deg, #059669, #10B981); box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3); }
.btn-blue { background: linear-gradient(135deg, #0284C7, #06B6D4); box-shadow: 0 4px 15px rgba(6, 182, 212, 0.3); }
.btn-amber { background: linear-gradient(135deg, #D97706, #F59E0B); box-shadow: 0 4px 15px rgba(245, 158, 11, 0.3); }
.btn-rose { background: linear-gradient(135deg, #E11D48, #F43F5E); box-shadow: 0 4px 15px rgba(244, 63, 94, 0.3); }

/* Responsive Grid */
@media (max-width: 1024px) {
    .stats-grid, .buttons-grid { grid-template-columns: repeat(2, 1fr); }
}
@media (max-width: 768px) {
    .sidebar { position: fixed; left: -280px; height: 100vh; }
    .sidebar.active { transform: translateX(280px); }
    .paste-layout, .prefix-grid { flex-direction: column; grid-template-columns: 1fr; }
    .workspace-inputs { width: 100%; }
    .stats-grid, .buttons-grid { grid-template-columns: 1fr; }
    .container { padding: 16px; }
}
</style>
</head>

<body>

<div class="toast-container" id="toastBox"></div>

<!-- Login Lock Overlay -->
<div class="login-overlay" id="loginOverlay">
    <div class="glass-panel login-card">
        <h2><i class="fa-solid fa-gem" style="color:var(--accent-purple);"></i> QyxnoraCore</h2>
        <p style="font-size:12px; color:var(--text-muted);">Enter system passcode to unlock</p>
        <input type="text" id="loginUser" placeholder="Username..." style="background:rgba(3,7,18,0.5); border:1px solid var(--card-border); padding:12px; border-radius:12px; color:#fff; outline:none; text-align:center;">
        <button class="btn btn-purple" onclick="handleLogin()"><i class="fa-solid fa-key"></i> Unlock System</button>
    </div>
</div>

<div class="app-layout" id="appLayout">
    <!-- Sidebar -->
    <div class="sidebar">
        <div class="brand">
            <i class="fa-solid fa-gem"></i> QyxnoraCore <span class="brand-badge">v3.0</span>
        </div>

        <div style="display:flex; flex-direction:column; gap:4px;">
            <a class="nav-item active"><i class="fa-solid fa-house"></i> Dashboard</a>
            <div class="nav-title">WORKSPACE</div>
            <a class="nav-item" onclick="deduplicate()"><i class="fa-solid fa-clone"></i> Deduplicate</a>
            <a class="nav-item" onclick="copyAllRemaining()"><i class="fa-solid fa-copy"></i> Copy Pending</a>
            <a class="nav-item" onclick="exportTxt()"><i class="fa-solid fa-file-arrow-down"></i> Export TXT</a>
            <a class="nav-item" onclick="clearWorkspace()"><i class="fa-solid fa-trash-can"></i> Clear All</a>
            <div class="nav-title">ACCOUNT</div>
            <a class="nav-item" onclick="handleLogout()"><i class="fa-solid fa-lock"></i> Lock Dashboard</a>
        </div>

        <!-- Sidebar Diamond Art -->
        <div class="sidebar-diamond-art">
            <i class="fa-solid fa-gem diamond-icon"></i>
        </div>
    </div>

    <!-- Main Content -->
    <div class="main-content">
        <!-- Header -->
        <div class="top-header">
            <div class="search-box">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" id="searchKey" placeholder="Search number or country..." oninput="render()">
            </div>
            <div style="display:flex; align-items:center; gap:12px;">
                <div style="width:38px; height:38px; border-radius:50%; background:linear-gradient(135deg, var(--accent-purple), var(--accent-cyan)); display:flex; align-items:center; justify-content:center; font-weight:800;" id="userAvatar">A</div>
            </div>
        </div>

        <div class="container">
            <!-- Phase 2: Animated Stats Grid (ইনিশিয়াল ০ দিয়ে ফিক্সড) -->
            <div class="stats-grid">
                <div class="glass-panel stat-card purple">
                    <div>
                        <div style="font-size:11px; font-weight:700; color:var(--text-muted);">TOTAL NUMBERS</div>
                        <div class="val" id="cntTotal">0</div>
                    </div>
                    <div class="stat-icon"><i class="fa-solid fa-list-ol"></i></div>
                </div>

                <div class="glass-panel stat-card emerald">
                    <div>
                        <div style="font-size:11px; font-weight:700; color:var(--text-muted);">COPIED</div>
                        <div class="val" id="cntCopied">0</div>
                    </div>
                    <div class="stat-icon"><i class="fa-solid fa-check"></i></div>
                </div>

                <div class="glass-panel stat-card amber">
                    <div>
                        <div style="font-size:11px; font-weight:700; color:var(--text-muted);">PENDING</div>
                        <div class="val" id="cntPending">0</div>
                    </div>
                    <div class="stat-icon"><i class="fa-solid fa-hourglass-half"></i></div>
                </div>

                <div class="glass-panel stat-card cyan">
                    <div>
                        <div style="font-size:11px; font-weight:700; color:var(--text-muted);">COUNTRIES</div>
                        <div class="val" id="cntCountries">0</div>
                    </div>
                    <div class="stat-icon"><i class="fa-solid fa-globe"></i></div>
                </div>
            </div>

            <!-- Paste Data Section -->
            <div class="glass-panel" style="padding: 24px;">
                <div style="font-size: 13px; font-weight: 800; color: var(--accent-purple);"><i class="fa-solid fa-paste"></i> PASTE YOUR DATA</div>
                <div class="paste-layout">
                    <textarea id="rawInput" class="paste-box" placeholder="Paste your raw numbers or data here..." oninput="parseData()"></textarea>
                    <div class="workspace-inputs">
                        <input type="text" id="projTitle" placeholder="Workspace Name">
                        <button class="btn btn-purple" onclick="saveProject()"><i class="fa-solid fa-floppy-disk"></i> Save Workspace</button>
                    </div>
                </div>
            </div>

            <!-- Workspace Bar -->
            <div>
                <div style="font-size: 11px; font-weight: 800; color: var(--text-muted); margin-bottom: 8px;">SAVED WORKSPACES</div>
                <div class="ws-list" id="projList"></div>
            </div>

            <!-- Modern Tabs -->
            <div class="filter-bar">
                <button class="filter-btn active" id="filterAllBtn" onclick="setFilter('all')">All Numbers <span id="tabCntAll">(0)</span></button>
                <button class="filter-btn" id="filterPendingBtn" onclick="setFilter('pending')">All Pending <span id="tabCntPending">(0)</span></button>
                <button class="filter-btn" id="filterCopiedBtn" onclick="setFilter('copied')">All Copied <span id="tabCntCopied">(0)</span></button>
            </div>

            <!-- Phase 3: Premium Data Table -->
            <div class="glass-panel table-card">
                <table>
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>Country</th>
                            <th>Number</th>
                            <th>Status</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="dataTable">
                        <!-- কাস্টম ডায়নামিক ডাটা রেন্ডার হবে -->
                    </tbody>
                </table>
            </div>

            <!-- Phase 4: Tools Control Panel -->
            <div class="prefix-grid">
                <div class="prefix-box">
                    <input type="text" id="prefixRemove" placeholder="Remove Prefix (e.g. 216)">
                    <button class="btn btn-rose" style="padding: 6px 12px;" onclick="applyRemovePrefix()"><i class="fa-solid fa-xmark"></i></button>
                </div>
                <div class="prefix-box">
                    <input type="text" id="prefixAdd" placeholder="Add Prefix (e.g. 216)">
                    <button class="btn btn-purple" style="padding: 6px 12px;" onclick="applyAddPrefix()"><i class="fa-solid fa-plus"></i></button>
                </div>
            </div>

            <div class="buttons-grid">
                <button class="btn btn-emerald" onclick="applyRemovePrefix()"><i class="fa-solid fa-eraser"></i> Remove Prefix</button>
                <button class="btn btn-blue" onclick="applyAddPrefix()"><i class="fa-solid fa-circle-plus"></i> Add Prefix</button>
                <button class="btn btn-purple" onclick="applyPlus(true)"><i class="fa-solid fa-plus"></i> Add +</button>
                <button class="btn btn-amber" onclick="applyPlus(false)"><i class="fa-solid fa-minus"></i> Remove +</button>
                <button class="btn btn-rose" onclick="deduplicate()"><i class="fa-solid fa-clone"></i> Remove Duplicate</button>
                <button class="btn btn-blue" onclick="copyAllRemaining()"><i class="fa-solid fa-copy"></i> Copy All Pending</button>
                <button class="btn btn-emerald" onclick="exportTxt()"><i class="fa-solid fa-download"></i> Download TXT</button>
                <button class="btn btn-rose" onclick="clearWorkspace()"><i class="fa-solid fa-trash-can"></i> Clear Workspace</button>
            </div>
        </div>
    </div>
</div>

<script>
// Valid User Passcodes
const validUsers = ["QyxnoraCore", "Rafin2332", "Salma89340", "Tanvir1234", "MFaheem123", "Mahmudsakib"];
let items = [];
let projects = JSON.parse(localStorage.getItem('qyx_projects_v4')) || [];
let activeProjIdx = -1;
let currentFilter = 'all';

const flags = {
    "Bangladesh": "🇧🇩", "India": "🇮🇳", "United States": "🇺🇸", "Pakistan": "🇵🇰",
    "United Kingdom": "🇬🇧", "Canada": "🇨🇦", "Australia": "🇦🇺", "Saudi Arabia": "🇸🇦",
    "United Arab Emirates": "🇦🇪", "Malaysia": "🇲🇾"
};

function showToast(msg) {
    const box = document.getElementById("toastBox");
    const t = document.createElement("div");
    t.className = "toast";
    t.innerText = msg;
    box.appendChild(t);
    setTimeout(() => t.remove(), 2200);
}

function handleLogin() {
    const val = document.getElementById('loginUser').value.trim();
    if (validUsers.includes(val)) {
        document.getElementById('loginOverlay').style.display = 'none';
        document.getElementById('appLayout').style.display = 'flex';
        document.getElementById('userAvatar').innerText = val.charAt(0).toUpperCase();
        renderProjSidebar();
        render();
        showToast("Welcome Back!");
    } else {
        alert("Invalid User!");
    }
}

function handleLogout() {
    location.reload();
}

function detectCountry(str) {
    for (let c in flags) {
        if (str.toLowerCase().includes(c.toLowerCase())) return c;
    }
    return "Unknown";
}

function parseData() {
    activeProjIdx = -1;
    let txt = document.getElementById("rawInput").value;
    let lines = txt.split("\n");
    items = [];

    lines.forEach(l => {
        let trimmed = l.trim();
        if (!trimmed) return;
        let cName = detectCountry(trimmed);
        let matches = trimmed.match(/\d{8,15}/g);
        if (matches && matches.length > 0) {
            items.push({
                number: matches[0],
                country: cName,
                copied: false
            });
        }
    });

    renderProjSidebar();
    render();
}

function setFilter(type) {
    currentFilter = type;
    document.getElementById('filterAllBtn').classList.toggle('active', type === 'all');
    document.getElementById('filterPendingBtn').classList.toggle('active', type === 'pending');
    document.getElementById('filterCopiedBtn').classList.toggle('active', type === 'copied');
    render();
}

function render() {
    let tbody = document.getElementById("dataTable");
    tbody.innerHTML = "";
    let q = document.getElementById("searchKey").value.toLowerCase();
    
    let copiedCnt = items.filter(i => i.copied).length;
    let pendingCnt = items.length - copiedCnt;
    let countrySet = new Set(items.map(i => i.country));

    // Dynamic Updates (এখন কিছু না বসালে নিখুঁত ০ দেখাবে)
    document.getElementById("cntTotal").innerText = items.length.toLocaleString();
    document.getElementById("cntCopied").innerText = copiedCnt.toLocaleString();
    document.getElementById("cntPending").innerText = pendingCnt.toLocaleString();
    document.getElementById("cntCountries").innerText = items.length > 0 ? countrySet.size : 0;

    document.getElementById("tabCntAll").innerText = `(${items.length})`;
    document.getElementById("tabCntPending").innerText = `(${pendingCnt})`;
    document.getElementById("tabCntCopied").innerText = `(${copiedCnt})`;

    let filtered = items.filter(i => {
        let match = i.number.toLowerCase().includes(q) || i.country.toLowerCase().includes(q);
        if (!match) return false;
        if (currentFilter === 'pending') return !i.copied;
        if (currentFilter === 'copied') return i.copied;
        return true;
    });

    if (filtered.length === 0) {
        tbody.innerHTML = `<tr><td colspan="5" style="text-align:center; color:var(--text-muted); padding:30px;">No numbers available</td></tr>`;
        return;
    }

    filtered.forEach((i, idx) => {
        let flag = flags[i.country] || "🌍";
        let tr = document.createElement("tr");
        tr.innerHTML = `
            <td>${idx + 1}</td>
            <td><span style="margin-right:6px;">${flag}</span> ${i.country}</td>
            <td style="font-weight:700; color:#fff;">${i.number}</td>
            <td>
                <span class="badge-status ${i.copied ? 'badge-copied' : 'badge-pending'}">
                    <i class="fa-solid ${i.copied ? 'fa-check' : 'fa-clock'}"></i>
                    ${i.copied ? 'Copied' : 'Pending'}
                </span>
            </td>
            <td>
                <i class="fa-regular fa-copy" style="cursor:pointer; color:var(--text-muted);" onclick="copySingle('${i.number}')"></i>
            </td>
        `;
        tbody.appendChild(tr);
    });
}

function copySingle(num) {
    navigator.clipboard.writeText(num);
    let itm = items.find(x => x.number === num);
    if(itm) {
        itm.copied = true;
        render();
        showToast("Number Copied!");
    }
}

function copyAllRemaining() {
    let pendingList = items.filter(x => !x.copied).map(x => x.number);
    if(pendingList.length === 0) return showToast("No pending numbers!");
    navigator.clipboard.writeText(pendingList.join("\n"));
    items.forEach(x => x.copied = true);
    render();
    showToast("Copied All Pending!");
}

function applyRemovePrefix() {
    let p = document.getElementById("prefixRemove").value.trim();
    if(!p) return;
    items.forEach(i => { if(i.number.startsWith(p)) i.number = i.number.slice(p.length); });
    render();
    showToast("Prefix Removed!");
}

function applyAddPrefix() {
    let p = document.getElementById("prefixAdd").value.trim();
    if(!p) return;
    items.forEach(i => { i.number = p + i.number; });
    render();
    showToast("Prefix Added!");
}

function applyPlus(add) {
    items.forEach(i => {
        if(add && !i.number.startsWith("+")) i.number = "+" + i.number;
        if(!add) i.number = i.number.replace(/^\+/, '');
    });
    render();
    showToast(add ? "Added '+'" : "Removed '+'");
}

function deduplicate() {
    let before = items.length;
    let seen = new Set();
    items = items.filter(i => {
        if(seen.has(i.number)) return false;
        seen.add(i.number);
        return true;
    });
    render();
    showToast(`Removed ${before - items.length} Duplicates`);
}

function clearWorkspace() {
    items = [];
    document.getElementById("rawInput").value = "";
    render();
    showToast("Workspace Cleared!");
}

function saveProject() {
    let title = document.getElementById("projTitle").value.trim() || "Workspace " + (projects.length + 1);
    if(items.length === 0) return showToast("No data to save!");
    projects.push({ name: title, items: JSON.parse(JSON.stringify(items)) });
    activeProjIdx = projects.length - 1;
    localStorage.setItem('qyx_projects_v4', JSON.stringify(projects));
    renderProjSidebar();
    showToast("Workspace Saved!");
}

function renderProjSidebar() {
    let box = document.getElementById("projList");
    box.innerHTML = "";
    projects.forEach((p, idx) => {
        let div = document.createElement("div");
        div.className = `ws-item ${idx === activeProjIdx ? 'active' : ''}`;
        div.onclick = () => {
            activeProjIdx = idx;
            items = JSON.parse(JSON.stringify(p.items));
            render();
        };
        div.innerHTML = `<div><div style="font-size:12px; font-weight:700;">📁 ${p.name}</div><div style="font-size:10px; color:var(--text-muted);">${p.items.length} Numbers</div></div>`;
        box.appendChild(div);
    });
}

function exportTxt() {
    if(items.length === 0) return showToast("No data!");
    let blob = new Blob([items.map(x => x.number).join("\n")], {type: "text/plain"});
    let a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = `numbers_export.txt`;
    a.click();
}
</script>
